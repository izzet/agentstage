[pytest]
testpaths = .
addopts = -v --tb=short
markers =
    h1: H1 slack windows (serves C1, C6)
    h2: H2 intent from thinking (serves C2, C5)
    h3: H3 working-set predictability (serves C2, C3 — headline)
    h4: H4 tiered staging architecture (serves C2/C3 + GOES collapse case)
    h5: H5 planning prompts as a free lever (serves C6)
    h7: H7 within-corpus leave-one-out generalization (serves E3 / L1 genericity)
    h8: H8 end-to-end staging effectiveness (serves C8, E5)
    h9: H9 cold-tier bandwidth sensitivity (serves E6)
    h10: H10 proxy overhead and graceful degradation (serves E4, E7)
    h11: H11 first-tool is a filesystem probe (96.1% list_dir; serves C2)
    h12: H12 pathful prompting does not improve recall (serves C1, justifies auto-rules)
