[project]
name = "agentstage"
version = "0.1.0"
description = "Streaming-intent-driven tiered data staging for scientific LLM agents."
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Izzet Yildirim", email = "iyildirim@hawk.iit.edu" }
]
requires-python = ">=3.12"
dependencies = [
    "agentiobench",
    "anthropic>=0.103.1",
    "google-genai>=2.5.0",
    "openai>=1.40",
    "xxhash>=3.7.0",
]

[project.optional-dependencies]
# Staging expands .gz/.bz2/.xz targets with the standard library. Only .zst
# needs a third-party codec, so it stays opt-in: without it the stager skips
# .zst sources rather than failing.
zstd = ["zstandard>=0.22"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "zstandard>=0.22",
]

[build-system]
requires = ["uv_build>=0.11.15,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.uv.workspace]
members = [
    "external/benchmarks/agentiobench",
]

[tool.uv.sources]
agentiobench = { workspace = true, editable = true }
