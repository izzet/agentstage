[project]
name = "agentstage"
version = "0.1.0"
description = "Streaming-intent-driven tiered data staging for scientific LLM agents."
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Izzet Yildirim", email = "iyildirim@hawk.iit.edu" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.103.1",
    "google-genai>=2.5.0",
    "openai>=1.40",
    "pyyaml>=6.0",
    "xxhash>=3.7.0",
]

[project.optional-dependencies]
# Codecs that need a third-party library. Staging expands .gz/.bz2/.xz with
# the standard library, so this is additive rather than required: without it
# the stager skips sources it cannot decode rather than failing. Future
# codecs (lz4, brotli) belong here too.
codecs = ["zstandard>=0.22"]
# ScienceAgentBench workload only; imported lazily so its absence costs
# nothing until that dataset is actually loaded.
sab = ["datasets>=2.19"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "zstandard>=0.22",
]

[build-system]
requires = ["uv_build>=0.11.15,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

# AgentIOBench is picked up as a workspace member when the submodule is
# checked out. It is deliberately NOT a dependency: the detector, stager,
# shim and clients never import it, and the two call sites that can use it
# guard with try/except. Declaring it would make the whole package
# uninstallable for anyone without access to that repository.
[tool.uv.workspace]
members = [
    "external/benchmarks/agentiobench",
]

